name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Web-App und Daten
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Includes the validation of all bundled datasets against kommunen.json.
      - run: npm test
      # Fails on invalid data and regenerates the JSON Schemas from the Zod schemas.
      - run: npm run build
      - name: JSON-Schemas sind aktuell
        run: git diff --exit-code -- public/data/schema
      # Runs against the production build in the preinstalled Google Chrome.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  importer:
    name: PDF-Importer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements-dev.txt
      - run: ruff check scripts
      - run: ruff format --check scripts
      # Golden tests: the importers must reproduce the bundled datasets from the text fixtures.
      - run: pytest
